<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NeuroCare AI</title>

    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= LOGIN WRAPPER ================= -->
<div class="hero">

    <div class="glass-card login-card">

        <h1>NeuroCare AI Login</h1>

        <p>Access your AI-powered healthcare dashboard</p>

        <!-- ================= LOGIN FORM ================= -->
        <form id="loginForm">

            <!-- EMAIL -->
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn-primary full-btn">
                Login to Dashboard
            </button>

        </form>

        <p class="small-text">
            Secure AI healthcare authentication system
        </p>

        <p class="small-text">
            Don't have an account? <a href="register.html">Register here</a>
        </p>

    </div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
const API_BASE = "http://localhost:5000/api";

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter email and password.");
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || "Login failed");
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("userRole", data.user.role);

        if (data.user.role === "doctor") {
            window.location.href = "doctor-dashboard.html";
            return;
        }

        if (data.user.role === "patient") {
            window.location.href = "patient.html";
        } else if (data.user.role === "caregiver") {
            window.location.href = "caregiver.html";
        } else {
            window.location.href = "patient.html";
        }
    } catch (error) {
        alert(error.message);
    }
});
</script>

</body>
</html>
